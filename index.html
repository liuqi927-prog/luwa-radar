const sceneMap = {
  '户外': ['公园','徒步','乐园','森林','山','步道','溪','湖'],
  '室内': ['博物馆','科普','手工','探索馆','乐园','科幻','影','艺术'],
  '免费': [],
  '动物': ['农场','动物','麋鹿','蜜蜂','鸡蛋','奶牛','鸭'],
  '采摘': ['采摘','农场','葡萄','草莓','农业','农机'],
  '露营': ['露营','营地','野餐','湿地','烧烤']
};

function getZone(p) {
  if (p.district === '昌平区') return '昌平';
  const d = (p.distance_from_changping || '').toLowerCase();
  if (d.includes('45') || d.includes('1小时') || d.includes('1.5') || d.includes('远') || d.includes('60')) return '远距离';
  return '近距离';
}

function getCostCat(p) {
  const c = p.cost || '';
  if (c.includes('免费')) return 'free';
  const nums = c.match(/\d+/g);
  if (nums && parseInt(nums[0]) <= 50) return 'low';
  return 'mid';
}

function renderCard(p, idx, animate) {
  const costCat = getCostCat(p);
  const costClass = costCat === 'free' ? 'cost-free' : costCat === 'low' ? 'cost-low' : 'cost-mid';
  const crowdClass = (p.crowd_level||'').includes('低') ? 'tag-crowd-low' : 'tag-crowd-mid';
  const animClass = animate ? ' fade-in' : '';
  return `<div class="card${animClass}" data-idx="${idx}" data-zone="${getZone(p)}" data-cost="${costCat}" onclick="showDetail(${idx})">
    ${p.image_url ? `<img class="card-img" src="${p.image_url}" alt="${p.name}" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none';var d=document.createElement('div');d.className='card-img-fallback';d.style.cssText='width:100%;height:140px;display:flex;align-items:center;justify-content:center;font-size:48px;background:linear-gradient(135deg,#E8F5E9,#C8E6C9)';d.textContent='🌿';this.parentElement.insertBefore(d,this.parentElement.firstChild)">` : ''}
    <div class="card-body">
    <div class="card-header">
      <div class="card-name">${p.name}</div>
      <span class="card-cost ${costClass}">${p.cost || '详询'}</span>
    </div>
    <div class="card-highlight">${p.highlight}</div>
    ${p.description ? `<div class="card-desc">${p.description}</div>` : ''}
    <div class="card-tags">
      <span class="tag tag-district">${p.district}</span>
      <span class="tag tag-category">${p.category}</span>
      <span class="tag ${crowdClass}">👥 ${p.crowd_level||'未知'}</span>
      <span class="tag">${p.best_season||'四季'}</span>
      ${p.age_range ? `<span class="tag">👶 ${p.age_range}</span>` : ''}
    </div>
    </div>
  </div>`;
}

const cardList = document.getElementById('cardList');
let currentFilter = 'all', currentScene = null, shuffleMode = false;

function renderAll(animate) {
  cardList.innerHTML = places.map((p,i) => renderCard(p,i,animate)).join('');
  applyFilters();
}

function applyFilters() {
  if (shuffleMode) return;
  const cards = cardList.querySelectorAll('.card');
  let visible = 0;
  cards.forEach(card => {
    const idx = parseInt(card.dataset.idx);
    const p = places[idx];
    const zone = card.dataset.zone;
    const costCat = card.dataset.cost;
    let show = true;
    if (currentFilter === '免费') show = costCat === 'free';
    else if (currentFilter !== 'all') show = zone === currentFilter;
    if (show && currentScene) {
      if (currentScene === '免费') { show = costCat === 'free'; }
      else {
        const kws = sceneMap[currentScene] || [];
        const text = (p.category+' '+p.highlight+' '+p.name).toLowerCase();
        show = kws.some(k => text.includes(k));
      }
    }
    card.classList.toggle('hidden', !show);
    if (show) visible++;
  });
  document.getElementById('noResults').classList.toggle('show', visible===0);
  document.getElementById('listTitle').textContent = `📋 ${visible} 个地点`;
  document.getElementById('statShowing').textContent = visible;
}

// Shuffle recommend
function shuffleRecommend() {
  shuffleMode = true;
  const btn = document.getElementById('shuffleBtn');
  btn.classList.add('spinning');
  setTimeout(() => btn.classList.remove('spinning'), 500);
  
  // Reset filters
  currentFilter = 'all'; currentScene = null;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('[data-filter="all"]').classList.add('active');
  document.querySelectorAll('.scene-btn').forEach(b => b.classList.remove('active'));
  
  // Pick 6 random
  const indices = Array.from({length: places.length}, (_, i) => i);
  for (let i = indices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [indices[i], indices[j]] = [indices[j], indices[i]];
  }
  const picked = indices.slice(0, 6);
  
  cardList.innerHTML = picked.map(i => renderCard(places[i], i, true)).join('');
  
  document.getElementById('noResults').classList.remove('show');
  document.getElementById('listTitle').textContent = '🎲 随机推荐 6 个';
  document.getElementById('statShowing').textContent = '6';
  document.getElementById('modeIndicator').style.display = 'block';
  document.getElementById('modeTag').textContent = '🎲 随机推荐模式';
}

function resetAll() {
  shuffleMode = false;
  document.getElementById('modeIndicator').style.display = 'none';
  renderAll(true);
}

// Init
renderAll(false);
document.getElementById('statFree').textContent = places.filter(p => getCostCat(p)==='free').length;

// Filters
document.querySelectorAll('#distanceFilter .filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    shuffleMode = false;
    document.getElementById('modeIndicator').style.display = 'none';
    document.querySelectorAll('#distanceFilter .filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderAll(false); applyFilters();
  });
});

document.querySelectorAll('#sceneGrid .scene-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    shuffleMode = false;
    document.getElementById('modeIndicator').style.display = 'none';
    const wasActive = btn.classList.contains('active');
    document.querySelectorAll('.scene-btn').forEach(b => b.classList.remove('active'));
    if (!wasActive) { btn.classList.add('active'); currentScene = btn.dataset.scene; }
    else { currentScene = null; }
    renderAll(false); applyFilters();
  });
});

    ${p.description ? `<div class="detail-row"><div class="detail-label">📝 介绍</div><div class="detail-value">${p.description}</div></div>` : ''}`;

function closeDetail(e) { if (e.target===document.getElementById('overlay')) document.getElementById('overlay').classList.remove('show'); }
